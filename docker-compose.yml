version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bandmates_db
    restart: always
    command: --default-time-zone='+07:00'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bandmates_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      
  redis:
    image: redis:alpine
    container_name: bandmates_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bandmates_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  db_data:
